
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ano Kaya 'To?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f1eb;
            margin: 0;
            color: #333;
        }
        nav {
            background: #49372e;
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav a, nav button {
            color: white;
            text-decoration: none;
            margin-left: 15px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }
        input {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }
        button {
            background: #76523e;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .message {
            padding: 10px;
            background: #e5f4e5;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'dashboard' %}"><strong>Ano Kaya 'To?</strong></a>
        <div>
            {% if user.is_authenticated %}
                <a href="{% url 'profile' %}">My Profile</a>
                <form method="post" action="{% url 'logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </nav>

    <main class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
